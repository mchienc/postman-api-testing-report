<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%">
  <rect width="850" height="420" rx="8" fill="#1E1E1E"/>
  <rect width="850" height="38" rx="8" fill="#282828"/>
  <circle cx="20" cy="19" r="6" fill="#FF5F56"/><circle cx="40" cy="19" r="6" fill="#FFBD2E"/><circle cx="60" cy="19" r="6" fill="#27C93F"/>
  <text x="425" y="24" fill="#BBBBBB" font-family="sans-serif" font-size="12" text-anchor="middle">PUT Request - Cập nhật toàn bộ bài viết số 1</text>

  <!-- URL Bar -->
  <rect x="25" y="55" width="70" height="34" rx="4" fill="#2563EB"/>
  <text x="60" y="77" fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">PUT</text>
  <rect x="102" y="55" width="620" height="34" rx="4" fill="#2D2D2D" stroke="#444"/>
  <text x="115" y="77" fill="#F8FAFC" font-family="'Consolas', monospace" font-size="13">https://jsonplaceholder.typicode.com/posts/1</text>
  <rect x="730" y="55" width="95" height="34" rx="4" fill="#2563EB"/>
  <text x="777" y="77" fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="middle">Send</text>

  <!-- Body & Response Panels -->
  <rect x="25" y="100" width="395" height="170" rx="4" fill="#141414" stroke="#333"/>
  <text x="40" y="122" fill="#9CA3AF" font-family="sans-serif" font-size="11" font-weight="600">Request Body gửi lên:</text>
  <text x="40" y="145" fill="#E2E8F0" font-family="'Consolas', monospace" font-size="11">{</text>
  <text x="60" y="165" fill="#38BDF8" font-family="'Consolas', monospace" font-size="11">"id": <tspan fill="#F472B6">1</tspan>,</text>
  <text x="60" y="185" fill="#38BDF8" font-family="'Consolas', monospace" font-size="11">"title": <tspan fill="#FDE047">"Tieu de moi cap nhat"</tspan>,</text>
  <text x="60" y="205" fill="#38BDF8" font-family="'Consolas', monospace" font-size="11">"body": <tspan fill="#FDE047">"Noi dung da duoc sua doi qua PUT"</tspan>,</text>
  <text x="60" y="225" fill="#38BDF8" font-family="'Consolas', monospace" font-size="11">"userId": <tspan fill="#F472B6">1</tspan></text>
  <text x="40" y="245" fill="#E2E8F0" font-family="'Consolas', monospace" font-size="11">}</text>

  <rect x="430" y="100" width="395" height="170" rx="4" fill="#141414" stroke="#333"/>
  <text x="445" y="122" fill="#9CA3AF" font-family="sans-serif" font-size="11" font-weight="600">Response Body nhận về:</text>
  <text x="445" y="145" fill="#E2E8F0" font-family="'Consolas', monospace" font-size="11">{</text>
  <text x="465" y="165" fill="#38BDF8" font-family="'Consolas', monospace" font-size="11">"id": <tspan fill="#F472B6">1</tspan>,</text>
  <text x="465" y="185" fill="#38BDF8" font-family="'Consolas', monospace" font-size="11">"title": <tspan fill="#FDE047">"Tieu de moi cap nhat"</tspan>,</text>
  <text x="465" y="205" fill="#38BDF8" font-family="'Consolas', monospace" font-size="11">"body": <tspan fill="#FDE047">"Noi dung da duoc sua doi qua PUT"</tspan>,</text>
  <text x="465" y="225" fill="#38BDF8" font-family="'Consolas', monospace" font-size="11">"userId": <tspan fill="#F472B6">1</tspan></text>
  <text x="445" y="245" fill="#E2E8F0" font-family="'Consolas', monospace" font-size="11">}</text>

  <!-- Status -->
  <line x1="25" y1="285" x2="825" y2="285" stroke="#374151" stroke-width="1"/>
  <rect x="25" y="300" width="120" height="26" rx="4" fill="#064E3B"/>
  <text x="85" y="317" fill="#34D399" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">Status: 200 OK</text>
  <rect x="155" y="300" width="120" height="26" rx="4" fill="#1E293B"/>
  <text x="215" y="317" fill="#94A3B8" font-family="sans-serif" font-size="12" text-anchor="middle">Time: 140 ms</text>

  <rect x="25" y="340" width="800" height="60" rx="4" fill="#1E293B"/>
  <text x="45" y="375" fill="#34D399" font-family="sans-serif" font-size="13">✓ Cập nhật thành công toàn bộ dữ liệu của bài viết số 1.</text>
</svg>
