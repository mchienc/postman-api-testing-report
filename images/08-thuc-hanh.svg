<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 440" width="100%">
  <rect width="850" height="440" rx="8" fill="#1E1E1E"/>
  <rect width="850" height="38" rx="8" fill="#282828"/>
  <circle cx="20" cy="19" r="6" fill="#FF5F56"/><circle cx="40" cy="19" r="6" fill="#FFBD2E"/><circle cx="60" cy="19" r="6" fill="#27C93F"/>
  <text x="425" y="24" fill="#BBBBBB" font-family="sans-serif" font-size="12" text-anchor="middle">THỰC HÀNH - GET API Thời tiết (Weather API)</text>

  <!-- URL Bar -->
  <rect x="25" y="55" width="70" height="34" rx="4" fill="#0D9488"/>
  <text x="60" y="77" fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">GET</text>
  <rect x="102" y="55" width="620" height="34" rx="4" fill="#2D2D2D" stroke="#444"/>
  <text x="115" y="77" fill="#F8FAFC" font-family="'Consolas', monospace" font-size="12">https://api.open-meteo.com/v1/forecast?latitude=21.02&amp;longitude=105.83&amp;current_weather=true</text>
  <rect x="730" y="55" width="95" height="34" rx="4" fill="#2563EB"/>
  <text x="777" y="77" fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="middle">Send</text>

  <!-- Status Bar -->
  <line x1="25" y1="105" x2="825" y2="105" stroke="#374151" stroke-width="1"/>
  <rect x="580" y="115" width="110" height="24" rx="4" fill="#064E3B"/>
  <text x="635" y="131" fill="#34D399" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">Status: 200 OK</text>
  <rect x="700" y="115" width="125" height="24" rx="4" fill="#1E293B"/>
  <text x="762" y="131" fill="#94A3B8" font-family="sans-serif" font-size="11" text-anchor="middle">Time: 110 ms</text>

  <!-- Response Body -->
  <rect x="25" y="150" width="800" height="260" rx="4" fill="#141414" stroke="#333"/>
  <text x="45" y="178" fill="#9CA3AF" font-family="sans-serif" font-size="12" font-weight="600">Response Body (Weather Forecast Data):</text>
  <text x="45" y="205" fill="#E2E8F0" font-family="'Consolas', monospace" font-size="12">{</text>
  <text x="65" y="228" fill="#38BDF8" font-family="'Consolas', monospace" font-size="12">"latitude": <tspan fill="#F472B6">21.02</tspan>,</text>
  <text x="65" y="250" fill="#38BDF8" font-family="'Consolas', monospace" font-size="12">"longitude": <tspan fill="#F472B6">105.83</tspan>,</text>
  <text x="65" y="272" fill="#38BDF8" font-family="'Consolas', monospace" font-size="12">"timezone": <tspan fill="#FDE047">"GMT"</tspan>,</text>
  <text x="65" y="294" fill="#38BDF8" font-family="'Consolas', monospace" font-size="12">"current_weather": {</text>
  <text x="85" y="316" fill="#38BDF8" font-family="'Consolas', monospace" font-size="12">"temperature": <tspan fill="#34D399" font-weight="700">28.5</tspan>,</text>
  <text x="85" y="338" fill="#38BDF8" font-family="'Consolas', monospace" font-size="12">"windspeed": <tspan fill="#F472B6">11.2</tspan>,</text>
  <text x="85" y="360" fill="#38BDF8" font-family="'Consolas', monospace" font-size="12">"weathercode": <tspan fill="#F472B6">1</tspan></text>
  <text x="65" y="382" fill="#38BDF8" font-family="'Consolas', monospace" font-size="12">}</text>
  <text x="45" y="402" fill="#E2E8F0" font-family="'Consolas', monospace" font-size="12">}</text>
</svg>
