<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 480" width="100%">
  <rect width="850" height="480" rx="8" fill="#1E1E1E" />
  
  <!-- Window Titlebar -->
  <rect width="850" height="36" rx="8" fill="#2D2D2D" />
  <circle cx="20" cy="18" r="6" fill="#FF5F56" />
  <circle cx="40" cy="18" r="6" fill="#FFBD2E" />
  <circle cx="60" cy="18" r="6" fill="#27C93F" />
  <text x="425" y="23" fill="#AAAAAA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" text-anchor="middle">Postman - TC01 - GET All Posts</text>

  <!-- Request Bar -->
  <rect x="20" y="52" width="70" height="34" rx="4" fill="#0D9488" />
  <text x="55" y="74" fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">GET</text>

  <rect x="98" y="52" width="620" height="34" rx="4" fill="#2D2D2D" stroke="#3D3D3D" />
  <text x="110" y="74" fill="#38BDF8" font-family="'Consolas', monospace" font-size="13">{{baseUrl}}/posts</text>

  <rect x="726" y="52" width="104" height="34" rx="4" fill="#2563EB" />
  <text x="778" y="74" fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="middle">Send</text>

  <!-- Response Section Header -->
  <line x1="20" y1="102" x2="830" y2="102" stroke="#333333" stroke-width="1" />
  <text x="20" y="125" fill="#888888" font-family="sans-serif" font-size="12">Response</text>

  <!-- Status badges -->
  <rect x="520" y="112" width="85" height="22" rx="4" fill="#064E3B" />
  <text x="562" y="127" fill="#34D399" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">Status: 200 OK</text>

  <rect x="615" y="112" width="95" height="22" rx="4" fill="#1E293B" />
  <text x="662" y="127" fill="#94A3B8" font-family="sans-serif" font-size="11" text-anchor="middle">Time: 333 ms</text>

  <rect x="720" y="112" width="110" height="22" rx="4" fill="#1E293B" />
  <text x="775" y="127" fill="#94A3B8" font-family="sans-serif" font-size="11" text-anchor="middle">Size: 28.48 KB</text>

  <!-- Tabs: Body / Test Results -->
  <rect x="20" y="145" width="810" height="30" fill="#252526" />
  <text x="45" y="165" fill="#AAAAAA" font-family="sans-serif" font-size="12">Body</text>
  <rect x="85" y="145" width="120" height="30" fill="#1E1E1E" stroke="#FF6C37" stroke-width="0 0 2 0" />
  <text x="145" y="165" fill="#38BDF8" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">Test Results (4/4)</text>

  <!-- Test Results Content -->
  <g transform="translate(30, 195)">
    <!-- Item 1 -->
    <rect x="0" y="0" width="55" height="22" rx="4" fill="#16A34A" />
    <text x="27" y="15" fill="#FFFFFF" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">PASS</text>
    <text x="70" y="16" fill="#F8FAFC" font-family="sans-serif" font-size="13">Status code is 200 OK</text>

    <!-- Item 2 -->
    <rect x="0" y="38" width="55" height="22" rx="4" fill="#16A34A" />
    <text x="27" y="53" fill="#FFFFFF" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">PASS</text>
    <text x="70" y="54" fill="#F8FAFC" font-family="sans-serif" font-size="13">Response time is acceptable (&lt; 2000ms)</text>

    <!-- Item 3 -->
    <rect x="0" y="76" width="55" height="22" rx="4" fill="#16A34A" />
    <text x="27" y="91" fill="#FFFFFF" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">PASS</text>
    <text x="70" y="92" fill="#F8FAFC" font-family="sans-serif" font-size="13">Content-Type is application/json</text>

    <!-- Item 4 -->
    <rect x="0" y="114" width="55" height="22" rx="4" fill="#16A34A" />
    <text x="27" y="129" fill="#FFFFFF" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">PASS</text>
    <text x="70" y="130" fill="#F8FAFC" font-family="sans-serif" font-size="13">Response returns a list with 100 posts</text>
  </g>

  <!-- JSON Snippet Preview Box -->
  <rect x="30" y="365" width="790" height="95" rx="6" fill="#141414" stroke="#333333" />
  <text x="45" y="388" fill="#6B7280" font-family="'Consolas', monospace" font-size="11">// Response JSON snippet:</text>
  <text x="45" y="408" fill="#A5B4FC" font-family="'Consolas', monospace" font-size="11">[ { "userId": 1, "id": 1, "title": "sunt aut facere repellat provident occaecati...", "body": "quia et suscipit..." }, ... ]</text>
  <text x="45" y="432" fill="#10B981" font-family="'Consolas', monospace" font-size="11">✓ Total 100 items verified successfully</text>
</svg>
