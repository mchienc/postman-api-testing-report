<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 480" width="100%">
  <rect width="850" height="480" rx="8" fill="#0C1017" />
  
  <!-- Terminal Window Titlebar -->
  <rect width="850" height="36" rx="8" fill="#161B22" />
  <circle cx="20" cy="18" r="6" fill="#FF5F56" />
  <circle cx="40" cy="18" r="6" fill="#FFBD2E" />
  <circle cx="60" cy="18" r="6" fill="#27C93F" />
  <text x="425" y="23" fill="#8B949E" font-family="'Consolas', monospace" font-size="12" text-anchor="middle">PowerShell - npm test (newman runner)</text>

  <!-- Terminal Content -->
  <g transform="translate(25, 60)" font-family="'Consolas', 'Courier New', monospace" font-size="12">
    <!-- Command -->
    <text x="0" y="0" fill="#58A6FF">PS C:\postman-api-testing-report&gt; <tspan fill="#F0F6FC">npm test</tspan></text>
    
    <text x="0" y="25" fill="#8B949E">&gt; newman run collections/Postman_API_Testing_Suite.postman_collection.json -e ...</text>
    <text x="0" y="55" fill="#7EE787" font-weight="700">Postman API Testing Suite - Demo JSONPlaceholder</text>

    <!-- Requests -->
    <text x="0" y="85" fill="#C9D1D9">□ 1. GET Requests</text>
    <text x="15" y="105" fill="#8B949E">└ TC01 - GET All Posts</text>
    <text x="35" y="125" fill="#7EE787">√ Status code is 200 OK</text>
    <text x="35" y="145" fill="#7EE787">√ Response time is acceptable (&lt; 2000ms)</text>
    <text x="35" y="165" fill="#7EE787">√ Content-Type is application/json</text>

    <text x="0" y="195" fill="#C9D1D9">□ 2. POST Requests</text>
    <text x="15" y="215" fill="#8B949E">└ TC04 - POST Create New Post</text>
    <text x="35" y="235" fill="#7EE787">√ Status code is 201 Created</text>
    <text x="35" y="255" fill="#7EE787">√ Response contains created ID and correct data</text>

    <!-- Newman Table Box -->
    <g transform="translate(0, 275)">
      <rect x="0" y="0" width="800" height="110" rx="4" fill="#161B22" stroke="#30363D" />
      <text x="20" y="25" fill="#58A6FF">┌────────────────────┬──────────┬──────────┐</text>
      <text x="20" y="45" fill="#F0F6FC">│ requests: 8        │ exec: 8  │ fail: 0  │</text>
      <text x="20" y="65" fill="#7EE787">│ assertions: 19     │ pass: 19 │ fail: 0  │  --&gt; 100% PASSED</text>
      <text x="20" y="85" fill="#58A6FF">└────────────────────┴──────────┴──────────┘</text>
      <text x="450" y="45" fill="#8B949E">Total duration: 3.4s</text>
      <text x="450" y="65" fill="#8B949E">Avg response time: 344ms</text>
    </g>
  </g>
</svg>
