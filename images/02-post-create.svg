<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 480" width="100%">
  <rect width="850" height="480" rx="8" fill="#1E1E1E" />
  
  <!-- Window Titlebar -->
  <rect width="850" height="36" rx="8" fill="#2D2D2D" />
  <circle cx="20" cy="18" r="6" fill="#FF5F56" />
  <circle cx="40" cy="18" r="6" fill="#FFBD2E" />
  <circle cx="60" cy="18" r="6" fill="#27C93F" />
  <text x="425" y="23" fill="#AAAAAA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" text-anchor="middle">Postman - TC04 - POST Create New Post</text>

  <!-- Request Bar -->
  <rect x="20" y="52" width="70" height="34" rx="4" fill="#F59E0B" />
  <text x="55" y="74" fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">POST</text>

  <rect x="98" y="52" width="620" height="34" rx="4" fill="#2D2D2D" stroke="#3D3D3D" />
  <text x="110" y="74" fill="#38BDF8" font-family="'Consolas', monospace" font-size="13">{{baseUrl}}/posts</text>

  <rect x="726" y="52" width="104" height="34" rx="4" fill="#2563EB" />
  <text x="778" y="74" fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="middle">Send</text>

  <!-- Request Body Panel -->
  <rect x="20" y="98" width="400" height="150" rx="4" fill="#141414" stroke="#333333" />
  <text x="35" y="118" fill="#9CA3AF" font-family="sans-serif" font-size="11" font-weight="600">Request Body (raw JSON):</text>
  <text x="35" y="140" fill="#E2E8F0" font-family="'Consolas', monospace" font-size="11">{</text>
  <text x="50" y="160" fill="#38BDF8" font-family="'Consolas', monospace" font-size="11">"title": <tspan fill="#FDE047">"{{randomTitle}}"</tspan>,</text>
  <text x="50" y="180" fill="#38BDF8" font-family="'Consolas', monospace" font-size="11">"body": <tspan fill="#FDE047">"Noi dung kiem thu tu dong Postman"</tspan>,</text>
  <text x="50" y="200" fill="#38BDF8" font-family="'Consolas', monospace" font-size="11">"userId": <tspan fill="#F472B6">1</tspan></text>
  <text x="35" y="220" fill="#E2E8F0" font-family="'Consolas', monospace" font-size="11">}</text>

  <!-- Pre-request script badge -->
  <rect x="435" y="98" width="395" height="150" rx="4" fill="#18181B" stroke="#333333" />
  <text x="450" y="118" fill="#9CA3AF" font-family="sans-serif" font-size="11" font-weight="600">Pre-request Script Execution:</text>
  <text x="450" y="145" fill="#10B981" font-family="'Consolas', monospace" font-size="11">// Dynamic title generation</text>
  <text x="450" y="165" fill="#E2E8F0" font-family="'Consolas', monospace" font-size="11">pm.variables.set("randomTitle",</text>
  <text x="465" y="185" fill="#FDE047" font-family="'Consolas', monospace" font-size="11">"Kiem thu tu dong voi Postman " + rand);</text>
  <text x="450" y="220" fill="#60A5FA" font-family="'Consolas', monospace" font-size="11">✓ Value generated before request sent</text>

  <!-- Response Section Header -->
  <line x1="20" y1="260" x2="830" y2="260" stroke="#333333" stroke-width="1" />
  
  <!-- Status badges -->
  <rect x="20" y="272" width="120" height="24" rx="4" fill="#064E3B" />
  <text x="80" y="288" fill="#34D399" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">Status: 201 Created</text>

  <rect x="150" y="272" width="95" height="24" rx="4" fill="#1E293B" />
  <text x="197" y="288" fill="#94A3B8" font-family="sans-serif" font-size="11" text-anchor="middle">Time: 804 ms</text>

  <!-- Test Results -->
  <g transform="translate(20, 315)">
    <!-- Item 1 -->
    <rect x="0" y="0" width="55" height="22" rx="4" fill="#16A34A" />
    <text x="27" y="15" fill="#FFFFFF" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">PASS</text>
    <text x="70" y="16" fill="#F8FAFC" font-family="sans-serif" font-size="13">Status code is 201 Created</text>

    <!-- Item 2 -->
    <rect x="0" y="38" width="55" height="22" rx="4" fill="#16A34A" />
    <text x="27" y="53" fill="#FFFFFF" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">PASS</text>
    <text x="70" y="54" fill="#F8FAFC" font-family="sans-serif" font-size="13">Response contains created ID and correct data (ID: 101)</text>
  </g>

  <!-- Response JSON Preview -->
  <rect x="20" y="390" width="810" height="75" rx="4" fill="#141414" stroke="#333333" />
  <text x="35" y="410" fill="#6B7280" font-family="'Consolas', monospace" font-size="11">// Response Body (JSON):</text>
  <text x="35" y="430" fill="#34D399" font-family="'Consolas', monospace" font-size="11">{ "id": 101, "title": "Kiem thu tu dong voi Postman 742", "body": "...", "userId": 1 }</text>
</svg>
