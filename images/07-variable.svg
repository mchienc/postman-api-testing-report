<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 400" width="100%">
  <rect width="850" height="400" rx="8" fill="#1E1E1E"/>
  <rect width="850" height="38" rx="8" fill="#282828"/>
  <circle cx="20" cy="19" r="6" fill="#FF5F56"/><circle cx="40" cy="19" r="6" fill="#FFBD2E"/><circle cx="60" cy="19" r="6" fill="#27C93F"/>
  <text x="425" y="24" fill="#BBBBBB" font-family="sans-serif" font-size="12" text-anchor="middle">Sử dụng biến môi trường (Environment Variable) để lưu URL</text>

  <!-- URL Bar using variable -->
  <rect x="25" y="55" width="70" height="34" rx="4" fill="#0D9488"/>
  <text x="60" y="77" fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">GET</text>
  <rect x="102" y="55" width="620" height="34" rx="4" fill="#2D2D2D" stroke="#444"/>
  <text x="115" y="77" fill="#FDE047" font-family="'Consolas', monospace" font-size="14" font-weight="700">{{url}}</text>
  <text x="165" y="77" fill="#F8FAFC" font-family="'Consolas', monospace" font-size="13">/posts/1</text>
  <rect x="730" y="55" width="95" height="34" rx="4" fill="#2563EB"/>
  <text x="777" y="77" fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="middle">Send</text>

  <!-- Environment Variable Table Panel -->
  <line x1="25" y1="105" x2="825" y2="105" stroke="#374151" stroke-width="1"/>
  <text x="25" y="130" fill="#E2E8F0" font-family="sans-serif" font-size="13" font-weight="700">Environment Variables Setup:</text>

  <rect x="25" y="145" width="800" height="36" fill="#282828"/>
  <text x="45" y="168" fill="#9CA3AF" font-family="sans-serif" font-size="12" font-weight="600">VARIABLE</text>
  <text x="220" y="168" fill="#9CA3AF" font-family="sans-serif" font-size="12" font-weight="600">INITIAL VALUE</text>
  <text x="520" y="168" fill="#9CA3AF" font-family="sans-serif" font-size="12" font-weight="600">CURRENT VALUE</text>

  <rect x="25" y="185" width="800" height="42" fill="#212121"/>
  <text x="45" y="211" fill="#FDE047" font-family="'Consolas', monospace" font-size="13" font-weight="700">url</text>
  <text x="220" y="211" fill="#A5B4FC" font-family="'Consolas', monospace" font-size="12">https://jsonplaceholder.typicode.com</text>
  <text x="520" y="211" fill="#A5B4FC" font-family="'Consolas', monospace" font-size="12">https://jsonplaceholder.typicode.com</text>

  <rect x="25" y="255" width="800" height="110" rx="6" fill="#1E293B" stroke="#334155"/>
  <text x="45" y="285" fill="#38BDF8" font-family="sans-serif" font-size="13" font-weight="700">💡 Ưu điểm của việc đặt biến {{url}}:</text>
  <text x="45" y="315" fill="#94A3B8" font-family="sans-serif" font-size="12">• Không cần gõ lại đường dẫn cơ sở (Base URL) cho từng Request.</text>
  <text x="45" y="340" fill="#94A3B8" font-family="sans-serif" font-size="12">• Khi chuyển đổi giữa các môi trường Dev, Staging, Product chỉ cần thay đổi giá trị của biến.</text>
</svg>
