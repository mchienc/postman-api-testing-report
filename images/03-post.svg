<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 440" width="100%">
  <rect width="850" height="440" rx="8" fill="#1E1E1E"/>
  <rect width="850" height="38" rx="8" fill="#282828"/>
  <circle cx="20" cy="19" r="6" fill="#FF5F56"/><circle cx="40" cy="19" r="6" fill="#FFBD2E"/><circle cx="60" cy="19" r="6" fill="#27C93F"/>
  <text x="425" y="24" fill="#BBBBBB" font-family="sans-serif" font-size="12" text-anchor="middle">POST Request - Thêm bài viết mới</text>

  <!-- URL Bar -->
  <rect x="25" y="55" width="70" height="34" rx="4" fill="#F59E0B"/>
  <text x="60" y="77" fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">POST</text>
  <rect x="102" y="55" width="620" height="34" rx="4" fill="#2D2D2D" stroke="#444"/>
  <text x="115" y="77" fill="#F8FAFC" font-family="'Consolas', monospace" font-size="13">https://jsonplaceholder.typicode.com/posts</text>
  <rect x="730" y="55" width="95" height="34" rx="4" fill="#2563EB"/>
  <text x="777" y="77" fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="middle">Send</text>

  <!-- Request Body Panel -->
  <rect x="25" y="100" width="400" height="150" rx="4" fill="#141414" stroke="#333"/>
  <text x="40" y="122" fill="#9CA3AF" font-family="sans-serif" font-size="11" font-weight="600">Request Body (raw JSON):</text>
  <text x="40" y="145" fill="#E2E8F0" font-family="'Consolas', monospace" font-size="11">{</text>
  <text x="60" y="165" fill="#38BDF8" font-family="'Consolas', monospace" font-size="11">"title": <tspan fill="#FDE047">"Bai viet kiem thu Postman"</tspan>,</text>
  <text x="60" y="185" fill="#38BDF8" font-family="'Consolas', monospace" font-size="11">"body": <tspan fill="#FDE047">"Noi dung bai viet moi duoc tao"</tspan>,</text>
  <text x="60" y="205" fill="#38BDF8" font-family="'Consolas', monospace" font-size="11">"userId": <tspan fill="#F472B6">1</tspan></text>
  <text x="40" y="225" fill="#E2E8F0" font-family="'Consolas', monospace" font-size="11">}</text>

  <!-- Response Panel -->
  <rect x="435" y="100" width="390" height="150" rx="4" fill="#141414" stroke="#333"/>
  <text x="450" y="122" fill="#9CA3AF" font-family="sans-serif" font-size="11" font-weight="600">Response Body (JSON):</text>
  <text x="450" y="145" fill="#E2E8F0" font-family="'Consolas', monospace" font-size="11">{</text>
  <text x="470" y="165" fill="#38BDF8" font-family="'Consolas', monospace" font-size="11">"id": <tspan fill="#34D399" font-weight="700">101</tspan>,</text>
  <text x="470" y="185" fill="#38BDF8" font-family="'Consolas', monospace" font-size="11">"title": <tspan fill="#FDE047">"Bai viet kiem thu Postman"</tspan>,</text>
  <text x="470" y="205" fill="#38BDF8" font-family="'Consolas', monospace" font-size="11">"userId": <tspan fill="#F472B6">1</tspan></text>
  <text x="450" y="225" fill="#E2E8F0" font-family="'Consolas', monospace" font-size="11">}</text>

  <!-- Status badges -->
  <line x1="25" y1="265" x2="825" y2="265" stroke="#374151" stroke-width="1"/>
  <rect x="25" y="280" width="130" height="28" rx="4" fill="#064E3B"/>
  <text x="90" y="298" fill="#34D399" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">Status: 201 Created</text>
  <rect x="165" y="280" width="120" height="28" rx="4" fill="#1E293B"/>
  <text x="225" y="298" fill="#94A3B8" font-family="sans-serif" font-size="12" text-anchor="middle">Time: 180 ms</text>

  <rect x="25" y="325" width="800" height="85" rx="6" fill="#1E293B" stroke="#334155"/>
  <text x="45" y="355" fill="#38BDF8" font-family="sans-serif" font-size="13" font-weight="600">✓ Ý nghĩa kiểm thử POST:</text>
  <text x="45" y="380" fill="#94A3B8" font-family="sans-serif" font-size="12">Server đã tiếp nhận body JSON, tạo thành công tài nguyên mới và gán mã định danh ID = 101 với mã trạng thái 201 Created.</text>
</svg>
