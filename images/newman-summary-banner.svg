<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
  <rect width="800" height="240" rx="12" fill="#0F172A" />

  <text x="40" y="45" fill="#38BDF8" font-family="'Consolas', 'Courier New', monospace" font-size="16" font-weight="700">Newman Automated Test Runner Summary</text>
