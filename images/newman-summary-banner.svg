  <g transform="translate(40, 95)">
    <rect width="160" height="100" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <text x="80" y="32" fill="#94A3B8" font-family="sans-serif" font-size="12" text-anchor="middle">TOTAL REQUESTS</text>
    <text x="80" y="72" fill="#38BDF8" font-family="sans-serif" font-size="28" font-weight="700" text-anchor="middle">8 / 8</text>
    <text x="80" y="88" fill="#10B981" font-family="sans-serif" font-size="10" font-weight="600" text-anchor="middle">100% EXECUTED</text>
  </g>

  <!-- Metric Box 2 -->
  <g transform="translate(225, 95)">
    <rect width="160" height="100" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <text x="80" y="32" fill="#94A3B8" font-family="sans-serif" font-size="12" text-anchor="middle">ASSERTIONS</text>
    <text x="80" y="72" fill="#10B981" font-family="sans-serif" font-size="28" font-weight="700" text-anchor="middle">19 / 19</text>
    <text x="80" y="88" fill="#10B981" font-family="sans-serif" font-size="10" font-weight="600" text-anchor="middle">100% PASSED</text>
  </g>

  <!-- Metric Box 3 -->
  <g transform="translate(410, 95)">
