    <text x="82" y="32" fill="#94A3B8" font-family="sans-serif" font-size="12" text-anchor="middle">AVG RESPONSE TIME</text>
    <text x="82" y="72" fill="#F59E0B" font-family="sans-serif" font-size="28" font-weight="700" text-anchor="middle">344ms</text>
    <text x="82" y="88" fill="#94A3B8" font-family="sans-serif" font-size="10" font-weight="600" text-anchor="middle">TOTAL DURATION: 3.4s</text>
