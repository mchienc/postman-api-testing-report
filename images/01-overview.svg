<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%">
  <rect width="900" height="480" rx="8" fill="#1E1E1E"/>
  <!-- Title bar -->
  <rect width="900" height="38" rx="8" fill="#282828"/>
  <circle cx="20" cy="19" r="6" fill="#FF5F56"/>
  <circle cx="40" cy="19" r="6" fill="#FFBD2E"/>
  <circle cx="60" cy="19" r="6" fill="#27C93F"/>
  <text x="450" y="24" fill="#BBBBBB" font-family="sans-serif" font-size="12" text-anchor="middle">Postman - My Workspace - Overview</text>

  <!-- Sidebar -->
  <rect x="0" y="38" width="220" height="442" fill="#252526" stroke="#333" stroke-width="1"/>
  <text x="20" y="70" fill="#E2E8F0" font-family="sans-serif" font-size="13" font-weight="700">Collections</text>
  <rect x="15" y="85" width="190" height="32" rx="4" fill="#374151"/>
  <text x="30" y="106" fill="#F97316" font-family="sans-serif" font-size="12" font-weight="600">📁 API Testing Suite</text>
  <text x="40" y="136" fill="#94A3B8" font-family="sans-serif" font-size="11">GET Lấy danh sách</text>
  <text x="40" y="160" fill="#94A3B8" font-family="sans-serif" font-size="11">POST Tạo mới</text>
  <text x="40" y="184" fill="#94A3B8" font-family="sans-serif" font-size="11">PUT Cập nhật</text>
  <text x="40" y="208" fill="#94A3B8" font-family="sans-serif" font-size="11">DELETE Xóa</text>

  <text x="20" y="260" fill="#E2E8F0" font-family="sans-serif" font-size="13" font-weight="700">Environments</text>
  <text x="40" y="290" fill="#38BDF8" font-family="sans-serif" font-size="12">⚙ Test Environment</text>

  <!-- Main Request Panel -->
  <rect x="235" y="55" width="70" height="34" rx="4" fill="#0D9488"/>
  <text x="270" y="77" fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">GET</text>
  <rect x="312" y="55" width="460" height="34" rx="4" fill="#2D2D2D" stroke="#444"/>
  <text x="325" y="77" fill="#F8FAFC" font-family="'Consolas', monospace" font-size="13">https://jsonplaceholder.typicode.com/posts</text>
  <rect x="780" y="55" width="100" height="34" rx="4" fill="#2563EB"/>
  <text x="830" y="77" fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="middle">Send</text>

  <!-- Sub Tabs -->
  <text x="240" y="125" fill="#38BDF8" font-family="sans-serif" font-size="12" font-weight="600">Params</text>
  <text x="300" y="125" fill="#9CA3AF" font-family="sans-serif" font-size="12">Headers (7)</text>
  <text x="385" y="125" fill="#9CA3AF" font-family="sans-serif" font-size="12">Body</text>
  <text x="440" y="125" fill="#9CA3AF" font-family="sans-serif" font-size="12">Tests</text>

  <!-- Response Section -->
  <line x1="235" y1="145" x2="880" y2="145" stroke="#374151" stroke-width="1"/>
  <text x="240" y="175" fill="#AAAAAA" font-family="sans-serif" font-size="13">Response Body</text>
  <rect x="650" y="160" width="100" height="24" rx="4" fill="#064E3B"/>
  <text x="700" y="176" fill="#34D399" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">Status: 200 OK</text>
  <rect x="760" y="160" width="115" height="24" rx="4" fill="#1E293B"/>
  <text x="817" y="176" fill="#94A3B8" font-family="sans-serif" font-size="11" text-anchor="middle">Time: 125 ms</text>

  <rect x="235" y="195" width="645" height="260" rx="4" fill="#141414" stroke="#333"/>
  <text x="250" y="225" fill="#A5B4FC" font-family="'Consolas', monospace" font-size="12">[</text>
  <text x="270" y="250" fill="#A5B4FC" font-family="'Consolas', monospace" font-size="12">{</text>
  <text x="290" y="275" fill="#38BDF8" font-family="'Consolas', monospace" font-size="12">"userId": <tspan fill="#F472B6">1</tspan>,</text>
  <text x="290" y="300" fill="#38BDF8" font-family="'Consolas', monospace" font-size="12">"id": <tspan fill="#F472B6">1</tspan>,</text>
  <text x="290" y="325" fill="#38BDF8" font-family="'Consolas', monospace" font-size="12">"title": <tspan fill="#FDE047">"sunt aut facere repellat provident..."</tspan>,</text>
  <text x="290" y="350" fill="#38BDF8" font-family="'Consolas', monospace" font-size="12">"body": <tspan fill="#FDE047">"quia et suscipit suscipit recusandae..."</tspan></text>
  <text x="270" y="375" fill="#A5B4FC" font-family="'Consolas', monospace" font-size="12">}, ...</text>
  <text x="250" y="400" fill="#A5B4FC" font-family="'Consolas', monospace" font-size="12">]</text>
</svg>
