<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 400" width="100%">
  <rect width="850" height="400" rx="8" fill="#1E1E1E" />
  
  <!-- Window Titlebar -->
  <rect width="850" height="36" rx="8" fill="#2D2D2D" />
  <circle cx="20" cy="18" r="6" fill="#FF5F56" />
  <circle cx="40" cy="18" r="6" fill="#FFBD2E" />
  <circle cx="60" cy="18" r="6" fill="#27C93F" />
  <text x="425" y="23" fill="#AAAAAA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" text-anchor="middle">Postman - Environments / JSONPlaceholder - Environment</text>

  <!-- Environment Title -->
  <text x="30" y="75" fill="#FFFFFF" font-family="sans-serif" font-size="16" font-weight="700">JSONPlaceholder - Environment</text>
  <rect x="740" y="55" width="80" height="28" rx="4" fill="#FF6C37" />
  <text x="780" y="73" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Save</text>

  <!-- Table Header -->
  <rect x="30" y="100" width="790" height="34" rx="4" fill="#2D2D2D" />
  <text x="50" y="122" fill="#9CA3AF" font-family="sans-serif" font-size="12" font-weight="600">VARIABLE</text>
  <text x="220" y="122" fill="#9CA3AF" font-family="sans-serif" font-size="12" font-weight="600">TYPE</text>
  <text x="320" y="122" fill="#9CA3AF" font-family="sans-serif" font-size="12" font-weight="600">INITIAL VALUE</text>
  <text x="580" y="122" fill="#9CA3AF" font-family="sans-serif" font-size="12" font-weight="600">CURRENT VALUE</text>

  <!-- Row 1: baseUrl -->
  <rect x="30" y="142" width="790" height="42" fill="#252526" />
  <text x="50" y="168" fill="#38BDF8" font-family="'Consolas', monospace" font-size="13" font-weight="700">baseUrl</text>
  <text x="220" y="168" fill="#9CA3AF" font-family="sans-serif" font-size="12">default</text>
  <text x="320" y="168" fill="#F8FAFC" font-family="'Consolas', monospace" font-size="12">https://jsonplaceholder.typicode.com</text>
  <text x="580" y="168" fill="#F8FAFC" font-family="'Consolas', monospace" font-size="12">https://jsonplaceholder.typicode.com</text>

  <!-- Row 2: postId -->
  <rect x="30" y="190" width="790" height="42" fill="#1E1E1E" />
  <text x="50" y="216" fill="#38BDF8" font-family="'Consolas', monospace" font-size="13" font-weight="700">postId</text>
  <text x="220" y="216" fill="#9CA3AF" font-family="sans-serif" font-size="12">default</text>
  <text x="320" y="216" fill="#F8FAFC" font-family="'Consolas', monospace" font-size="12">1</text>
  <text x="580" y="216" fill="#F8FAFC" font-family="'Consolas', monospace" font-size="12">1</text>

  <!-- Row 3: New variable placeholder -->
  <rect x="30" y="238" width="790" height="42" fill="#252526" stroke="#3D3D3D" stroke-dasharray="4" />
  <text x="50" y="264" fill="#6B7280" font-family="sans-serif" font-size="12">Add a new variable...</text>

  <!-- Info Box -->
  <rect x="30" y="305" width="790" height="70" rx="6" fill="#1E293B" stroke="#334155" />
  <text x="50" y="332" fill="#38BDF8" font-family="sans-serif" font-size="12" font-weight="600">💡 Lợi ích của biến môi trường (Environment Variables):</text>
  <text x="50" y="354" fill="#94A3B8" font-family="sans-serif" font-size="12">Dễ dàng thay đổi URL giữa các môi trường Dev, Staging, Production mà không phải sửa lại từng request trong Collection.</text>
</svg>
