<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%">
  <rect width="850" height="420" rx="8" fill="#1E1E1E"/>
  <rect width="850" height="38" rx="8" fill="#282828"/>
  <circle cx="20" cy="19" r="6" fill="#FF5F56"/><circle cx="40" cy="19" r="6" fill="#FFBD2E"/><circle cx="60" cy="19" r="6" fill="#27C93F"/>
  <text x="425" y="24" fill="#BBBBBB" font-family="sans-serif" font-size="12" text-anchor="middle">GET Request - Chi tiết bài viết theo ID</text>

  <!-- URL Bar -->
  <rect x="25" y="55" width="70" height="34" rx="4" fill="#0D9488"/>
  <text x="60" y="77" fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">GET</text>
  <rect x="102" y="55" width="620" height="34" rx="4" fill="#2D2D2D" stroke="#444"/>
  <text x="115" y="77" fill="#F8FAFC" font-family="'Consolas', monospace" font-size="13">https://jsonplaceholder.typicode.com/posts/1</text>
  <rect x="730" y="55" width="95" height="34" rx="4" fill="#2563EB"/>
  <text x="777" y="77" fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="middle">Send</text>

  <!-- Status Bar -->
  <line x1="25" y1="105" x2="825" y2="105" stroke="#374151" stroke-width="1"/>
  <rect x="580" y="115" width="110" height="24" rx="4" fill="#064E3B"/>
  <text x="635" y="131" fill="#34D399" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">Status: 200 OK</text>
  <rect x="700" y="115" width="125" height="24" rx="4" fill="#1E293B"/>
  <text x="762" y="131" fill="#94A3B8" font-family="sans-serif" font-size="11" text-anchor="middle">Time: 75 ms</text>

  <!-- Response Body -->
  <rect x="25" y="150" width="800" height="240" rx="4" fill="#141414" stroke="#333"/>
  <text x="45" y="180" fill="#9CA3AF" font-family="sans-serif" font-size="12" font-weight="600">Response Body (JSON):</text>
  <text x="45" y="210" fill="#E2E8F0" font-family="'Consolas', monospace" font-size="12">{</text>
  <text x="65" y="235" fill="#38BDF8" font-family="'Consolas', monospace" font-size="12">"userId": <tspan fill="#F472B6">1</tspan>,</text>
  <text x="65" y="260" fill="#38BDF8" font-family="'Consolas', monospace" font-size="12">"id": <tspan fill="#F472B6">1</tspan>,</text>
  <text x="65" y="285" fill="#38BDF8" font-family="'Consolas', monospace" font-size="12">"title": <tspan fill="#FDE047">"sunt aut facere repellat provident occaecati excepturi optio reprehenderit"</tspan>,</text>
  <text x="65" y="310" fill="#38BDF8" font-family="'Consolas', monospace" font-size="12">"body": <tspan fill="#FDE047">"quia et suscipit suscipit recusandae consequuntur expedita et cum..."</tspan></text>
  <text x="45" y="335" fill="#E2E8F0" font-family="'Consolas', monospace" font-size="12">}</text>
</svg>
